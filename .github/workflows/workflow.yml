name: Version Updater

on:
  workflow_dispatch:
    inputs:
      build-version:
        description: 'Build version'
        required: true
        type: string
      file-path:
        description: 'File path inside target repo'
        required: true
        type: string
      target-repo:
        description: 'Target repository'
        required: true
        type: string

env:
  CHECKOUT_PATH: target-repo

jobs:
  update-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          path: ${{ env.CHECKOUT_PATH }}
          ref: master

      - name: Update YAML value
        env:
          VERSION: ${{ inputs.build-version }}
          CHECKOUT_PATH: ${{ env.CHECKOUT_PATH }}
          FILE_PATH: ${{ inputs.file-path }}
        run: |
          cd "$CHECKOUT_PATH"

          python3 -m pip install pyyaml

          python3 <<'EOF'
          import os
          import yaml

          file_path = os.environ["FILE_PATH"]
          new_version = os.environ["VERSION"]

          with open(file_path, "r") as f:
              data = yaml.safe_load(f)

          data["app"]["version"] = new_version

          with open(file_path, "w") as f:
              yaml.safe_dump(data, f, sort_keys=False)
          EOF

      - name: Commit and push to target repo
        env:
          CHECKOUT_PATH: ${{ env.CHECKOUT_PATH }}
          FILE_PATH: ${{ inputs.file-path }}
        run: |
          cd "$CHECKOUT_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE_PATH"

          if ! git diff --cached --quiet; then
            git commit -m "${{ github.event.repository.name }} (run #${{ github.run_number }}): Update app version to ${{ inputs.build-version }}"
            git push
          else
            echo "::error::No changes to commit"
            exit 1
          fi