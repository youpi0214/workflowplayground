name: Version Updater

on:
  workflow_dispatch:
    inputs:
      build-version:
        description: 'Build version'
        required: true
        type: string
      file-path:
        description: 'File path inside target repo'
        required: true
        type: string
      target-repo:
        description: 'Target repository'
        required: true
        type: string

env:
  CHECKOUT_PATH: target-repo

jobs:
  open-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          TARGET_REPO: ${{ inputs.target-repo }}
          BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          if gh release view "$BUILD_VERSION" --repo "$TARGET_REPO" > /dev/null 2>&1; then
            gh release edit "$BUILD_VERSION" \
              --repo "$TARGET_REPO" \
              --draft=true
          else
            gh release create "$BUILD_VERSION" \
              --repo "$TARGET_REPO" \
              --title "$BUILD_VERSION" \
              --draft
          fi
            
  update-config:
    runs-on: ubuntu-latest
    needs: open-release
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target-repo }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          path: ${{ env.CHECKOUT_PATH }}
          ref: master

      - name: Update YAML value
        env:
          VERSION: ${{ inputs.build-version }}
          CHECKOUT_PATH: ${{ env.CHECKOUT_PATH }}
          FILE_PATH: ${{ inputs.file-path }}
        run: |
          cd "$CHECKOUT_PATH"

          python3 -m pip install pyyaml

          python3 <<'EOF'
          import os
          import yaml

          file_path = os.environ["FILE_PATH"]
          new_version = os.environ["VERSION"]

          with open(file_path, "r") as f:
              data = yaml.safe_load(f)

          data["app"]["version"] = new_version

          with open(file_path, "w") as f:
              yaml.safe_dump(data, f, sort_keys=False)
          EOF

      - name: Commit and push to target repo
        env:
          CHECKOUT_PATH: ${{ env.CHECKOUT_PATH }}
          FILE_PATH: ${{ inputs.file-path }}
        run: |
          cd "$CHECKOUT_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE_PATH"

          if ! git diff --cached --quiet; then
            git commit \
              -m "${{ github.event.repository.name }}: Changed version to ${{ inputs.build-version }}" \
              -m "Workflow run #${{ github.run_number }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          else
            echo "::warning title=Version Already Selected:: Version was already set to ${{ inputs.build-version }} in ${{ inputs.file-path }}. No changes were made."
          fi

  close-release:
    runs-on: ubuntu-latest
    needs: [update-config]
    if: always()
    steps:
      - name: Convert release back to draft
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          TARGET_REPO: ${{ inputs.target-repo }}
          BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          gh release edit "$BUILD_VERSION" \
            --repo "$TARGET_REPO" \
            --draft=false \
            --latest